# ------------------------------------------------------------------
# Inventory of target instances.
#
# --- CURRENTLY SET UP FOR LOCAL VAGRANT TESTING ---
# This matches the included Vagrantfile out of the box. Just run
# `vagrant up`, then `ansible-playbook site.yml` — no editing needed
# to do your first test run.
#
# When you're ready to point at REAL cloud servers from Member 2's
# Terraform, comment out the "LOCAL TESTING" block below and
# uncomment/fill in the "REAL CLOUD SERVERS" block instead.
# ------------------------------------------------------------------

# ---- LOCAL TESTING (active by default) ----
[app_servers]
app1 ansible_host=192.168.56.10

[db_servers]
db1 ansible_host=192.168.56.10

[monitoring_servers]
mon1 ansible_host=192.168.56.10

[all_nodes:children]
app_servers
db_servers
monitoring_servers

[all_nodes:vars]
ansible_user=vagrant
ansible_ssh_private_key_file=.vagrant/machines/default/virtualbox/private_key
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'

