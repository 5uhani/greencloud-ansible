# ------------------------------------------------------------------
# Used ONLY by Vagrant's ansible_local provisioner.
# The playbook runs INSIDE the VM, targeting itself ("localhost"),
# so no SSH keys or remote connection setup is needed at all.
# ------------------------------------------------------------------

[app_servers]
localhost ansible_connection=local

[db_servers]
localhost ansible_connection=local

[monitoring_servers]
localhost ansible_connection=local

[all_nodes:children]
app_servers
db_servers
monitoring_servers
