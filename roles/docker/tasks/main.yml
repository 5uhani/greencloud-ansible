---
# ------------------------------------------------------------------
# ROLE: docker
# Purpose: install Docker + Compose so Member 3's FastAPI app and
# Member 4's PostgreSQL/Redis can be run as containers on any
# bootstrapped instance. Only applied to app_servers and db_servers.
# ------------------------------------------------------------------

- name: Install Docker prerequisite packages
  apt:
    name:
      - ca-certificates
      - gnupg
      - lsb-release
    state: present

- name: Add Docker's official GPG key
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Add Docker APT repository
  apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present

- name: Install Docker Engine and Compose plugin
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: yes

- name: Add deploy user to docker group
  user:
    name: deployer
    groups: docker
    append: yes

- name: Enable and start Docker service
  systemd:
    name: docker
    enabled: yes
    state: started
